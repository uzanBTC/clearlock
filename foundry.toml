[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[lint]
lint_on_build = false

[fuzz]
runs = 64

[invariant]
runs = 32
depth = 16
